name: Build APK and Release

permissions:
  contents: write

on:
  push:
    paths-ignore:
      - '**.md'
      - '**.metadata'
      - '.vscode/**'
      - '.VSCodeCounter/**'
      - '.gitignore'
    branches:
      - '*'
    tags:
      - '*'

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17.x"
          cache: "gradle"

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.32.8"
          cache: true

      - name: Verify Dart and core regressions
        shell: bash
        run: |
          flutter pub get
          flutter analyze
          flutter test
          mkdir -p build/core-tests
          javac -encoding UTF-8 --release 11 -d build/core-tests \
            android/app/src/main/java/com/tgwgroup/MiRearScreenSwitcher/CommandRunner.java \
            android/app/src/main/java/com/tgwgroup/MiRearScreenSwitcher/TaskSnapshot.java \
            android/app/src/main/java/com/tgwgroup/MiRearScreenSwitcher/PhysicalDisplayId.java \
            android/app/src/main/java/com/tgwgroup/MiRearScreenSwitcher/RearAnimationManager.java \
            android/app/src/main/java/com/tgwgroup/MiRearScreenSwitcher/TaskServiceClient.java \
            android/app/src/main/java/com/tgwgroup/MiRearScreenSwitcher/LiquidMotion.java \
            android/app/src/main/java/com/tgwgroup/MiRearScreenSwitcher/LiquidSurface.java \
            $(find tests/android-stubs -name '*.java') tests/*Test.java
          java -cp build/core-tests com.tgwgroup.MiRearScreenSwitcher.CoreRegressionTest
          java -cp build/core-tests com.tgwgroup.MiRearScreenSwitcher.ConnectionRegressionTest
          java -cp build/core-tests com.tgwgroup.MiRearScreenSwitcher.LiquidRegressionTest

      - name: Prepare keystore for signing
        shell: bash
        run: |
          echo "storeFile=keystore.jks" >> android/key.properties
          echo "keyAlias=${KEY_ALIAS}" >> android/key.properties
          echo "storePassword=${KEYSTORE_PASSWORD}" >> android/key.properties
          echo "keyPassword=${KEY_PASSWORD}" >> android/key.properties
          if [ -n "${KEYSTORE_FILE}" ]; then
            echo "${KEYSTORE_FILE}" | base64 --decode > android/app/keystore.jks || \
              (echo "Keystore file error, use debug signature.";rm -f android/key.properties)
          else
            echo "No keystore file provided, use debug signature."
            rm -f android/key.properties
          fi
        env:
          # https://github.com/GoldenglowSusie/MiRearScreenSwitcher/settings/secrets/actions/new
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Release APK
        shell: bash
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk MRSS-${{ github.ref_name }}-release.apk

      - name: Android Lint
        working-directory: android
        run: ./gradlew :app:lintDebug

      - name: Verify release certificate
        id: release_signature
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          expected=ae5e3c2a76c6f8e8c327124c96c15b9ec92f964aecec59eb5654e4918a87a24b
          if [ -n "$signer" ] && output=$("$signer" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk); then
            actual=$(printf '%s\n' "$output" | awk '/Signer #1 certificate SHA-256 digest:/ {print $NF}')
          else
            actual=''
          fi
          if [ "${actual,,}" = "$expected" ]; then
            echo 'matches=true' >> "$GITHUB_OUTPUT"
          else
            echo 'matches=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Release signing certificate does not match the project release identity; automatic publication skipped.'
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v5
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && steps.release_signature.outputs.matches == 'true'
        with:
          name: "${{ github.ref_name }}"
          # https://github.com/settings/personal-access-tokens/new
          token: ${{ secrets.PAT }}
          overwrite_files: false
          files: |
            MRSS-${{ github.ref_name }}-release.apk
